<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ahmad Droobi | Photos</title>
  <meta name="description" content="Photo gallery — fast masonry grid with animated hover, lightbox, filters, and keyboard nav." />
  <link rel="icon" href="img/licensed-image.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Material+Symbols+Rounded:FILL@0..1,GRAD@0..200,opsz@20..48,wght@300..700&display=swap" rel="stylesheet" />

  <style>
    :root{
      /* Theme */
      --bg: #0b1220;                  /* deep navy */
      --bg2:#0f1a33;
      --surface:#0f172a;              /* slate-navy card */
      --text:#e6e6e6;
      --muted:#a1a1aa;
      --brand:#8ab4f8;
      --chip:#111827;
      --accent:#8c1515;

      /* Layout */
      --colw:280px;
      --gap:14px;

      /* Optional hero background image (set to url('img/hero.jpg') if you want) */
      --bg-img: none;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f7fafc; --bg2:#e9eef6; --surface:#ffffff; --text:#1f2937; --muted:#6b7280; --brand:#1a73e8; --chip:#f3f4f6; }
    }

    /* Base */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 70% -10%, rgba(138,180,248,.18), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(140,21,21,.12), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--text);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, Helvetica, sans-serif;
      -webkit-font-smoothing:antialiased;
      position:relative;
      overflow-x:hidden;
    }
    /* Optional background image overlay */
    body::before{
      content:"";
      position:fixed; inset:0;
      background: var(--bg-img) center/cover no-repeat;
      opacity:.12; pointer-events:none; filter:saturate(1.1) contrast(1.05);
    }

    @keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){ *{animation-duration:0s!important; transition:none!important; scroll-behavior:auto!important} }

    /* Icons */
    .icon{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 600,"opsz" 24;vertical-align:middle;font-size:20px}

    /* App bar */
    .appbar{
      position:sticky; top:0; z-index:20;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(8px);
      display:flex; align-items:center; gap:14px; padding:10px 16px;
      border-bottom:1px solid rgba(255,255,255,.06)
    }
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
    .logo-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4285f4,#34a853 55%,#fbbc05 85%,#ea4335);box-shadow:0 0 0 2px rgba(255,255,255,.06) inset}
    .search{flex:1;display:flex;align-items:center;gap:10px;background:var(--chip);padding:10px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
    .search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
    .btn{
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      color:#fff;border:1px solid rgba(255,255,255,.08);
      border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease; display:inline-flex; align-items:center; gap:8px;
      box-shadow:0 6px 16px rgba(0,0,0,.22)
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.28)}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#003366,#8c1515)}

    /* Layout shell */
    .shell{display:grid;grid-template-columns:280px 1fr;gap:18px;max-width:1600px;margin:0 auto;padding:18px;animation:fadeInUp .35s ease-out both}
    @media (max-width:1080px){.shell{grid-template-columns:1fr}}

    /* Left rail */
    .rail{display:flex;flex-direction:column;gap:14px}
    .card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px;box-shadow:0 10px 25px rgba(2,6,23,.12)}
    .card h3{margin:0;padding:14px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px;padding:0 10px 12px}
    .chip{background:var(--chip);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;transition:background .2s ease, transform .2s ease, box-shadow .2s ease}
    .chip:hover{background:color-mix(in srgb, var(--chip) 70%, white 5%); transform:translateY(-1px)}
    .chip.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .list{padding:8px 8px 12px;display:grid;gap:8px}
    .list a{display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;color:var(--text);background:var(--chip);border:1px solid rgba(255,255,255,.1);border-radius:8px;transition:all .25s ease;font-size:14px}
    .list a:hover{background:color-mix(in srgb, var(--chip) 75%, white 6%); transform:translateY(-2px)}

    /* Masonry using CSS columns */
    .photos{column-width:var(--colw); column-gap:var(--gap)}
    @media (max-width:1200px){.photos{--colw:240px}}
    @media (max-width:900px){.photos{--colw:200px}}
    @media (max-width:640px){.photos{--colw:160px}}

    /* Photo card */
    .item{
      break-inside:avoid; display:block; margin:0 0 var(--gap); position:relative; border-radius:14px; overflow:hidden; background:#000;
      border:1px solid rgba(255,255,255,.06); transform:translateZ(0); will-change:transform, filter;
      box-shadow:0 1px 0 rgba(255,255,255,.04);
    }
    .thumb{
      width:100%; display:block; height:auto; opacity:0; transform:scale(1.01);
      transition: opacity .35s ease, transform .35s ease, filter .35s ease;
    }
    .item.loaded .thumb{opacity:1}

    /* Hover animation: zoom + slight tilt + glow + sheen */
    .item::after{
      content:""; position:absolute; inset:0;
      background: radial-gradient(800px 400px at 80% -10%, rgba(138,180,248,.18), transparent 60%);
      opacity:0; transition:opacity .35s ease;
      pointer-events:none;
    }
    .item .cap{
      position:absolute; left:10px; bottom:10px;
      background: rgba(15,23,42,.48); backdrop-filter: blur(6px);
      color:#f8fafc; font-size:12px; padding:6px 10px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
      transform: translateY(6px); opacity:0; transition: transform .28s ease, opacity .28s ease;
    }
    .item:hover .thumb{
      transform: scale(1.06) rotate(.35deg);
      filter: saturate(1.15) contrast(1.05);
    }
    .item:hover::after{opacity:1}
    .item:hover .cap{transform: translateY(0); opacity:1}

    /* Sheen sweep */
    .item::before{
      content:""; position:absolute; top:0; left:-120%; height:100%; width:45%;
      background: linear-gradient(75deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-18deg);
      opacity:0; pointer-events:none;
    }
    .item:hover::before{
      animation: sheen 750ms ease forwards;
      opacity:1;
    }
    @keyframes sheen{to{left:140%}}

    /* Selection (kept but visually subtle) */
    .item.selected{outline:2px solid #3b82f6; outline-offset:0}
    .overlay{position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:space-between; padding:8px; opacity:0; transition:opacity .15s ease; pointer-events:none}
    .item:hover .overlay{opacity:1}
    .circle{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35); pointer-events:auto}
    .item.selected .circle{background:#1a73e8;border-color:#1a73e8}

    /* Lightbox */
    .lightbox{position:fixed; inset:0; background:rgba(3,6,23,.96); display:none; align-items:center; justify-content:center; z-index:30}
    .lightbox.open{display:flex}
    .lb-img{max-width:92vw; max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .lb-top{position:fixed; top:16px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; color:#fff}
    .lb-btn{background:rgba(255,255,255,.1); padding:10px; border-radius:999px; cursor:pointer; border:1px solid rgba(255,255,255,.15)}
    .lb-nav{position:fixed; top:50%; transform:translateY(-50%); color:#fff}
    .lb-prev{left:24px}.lb-next{right:24px}

    /* Selection bar (kept minimal) */
    .selectbar{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; background:var(--surface); border:1px solid rgba(255,255,255,.08); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); display:none; align-items:center; gap:10px; padding:10px 12px; z-index:25}
    .selectbar.show{display:flex}

    /* Accessibility */
    .skip-link{position:absolute;top:-40px;left:0;background:#000;color:#fff;padding:8px 12px;z-index:1000;border-radius:0 0 4px 0;transition:top .2s ease}
    .skip-link:focus{top:0}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- App Bar -->
  <header class="appbar">
    <div class="logo"><span class="logo-badge" aria-hidden></span><span>Photos</span></div>
    <div class="search" role="search">
      <span class="icon">search</span>
      <input id="searchInput" placeholder="Search (name, tag)..." autocomplete="off" />
      <span id="clearSearch" class="icon" style="cursor:pointer;display:none">close</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="densityBtn" class="btn" title="Toggle density"><span class="icon">density_small</span> Density</button>
      <!-- Hidden “backend/demo” actions by request -->
      <!-- <button class="btn"><span class="icon">upload</span> Upload</button> -->
      <div class="avatar" title="Account"></div>
    </div>
  </header>

  <main class="shell" id="main-content">
    <!-- Left rail -->
    <aside class="rail">
      <section class="card">
        <h3>Filters</h3>
        <div class="chips" id="chips">
          <button class="chip active" data-chip="all">All</button>
          <button class="chip" data-chip="nature">Nature</button>
          <button class="chip" data-chip="events">Events</button>
          <button class="chip" data-chip="personal">Personal</button>
          <button class="chip" data-chip="academic">Academic</button>
          <button class="chip" data-chip="travel">Travel</button>
        </div>
      </section>

      <section class="card">
        <h3>Collections</h3>
        <div class="list">
          <a href="#" id="collection-all"><span class="icon">photo_library</span> All Photos</a>
          <a href="#" id="collection-favorites"><span class="icon">favorite</span> Favorites</a>
          <a href="#" id="collection-people"><span class="icon">group</span> People</a>
          <a href="#" id="collection-places"><span class="icon">location_on</span> Places</a>
          <a href="#" id="collection-albums"><span class="icon">event</span> Albums</a>
        </div>
      </section>
    </aside>

    <!-- Stream -->
    <section>
      <div class="photos" id="photos"></div>
    </section>
  </main>

  <!-- Selection bar -->
  <div id="selectbar" class="selectbar" role="status" aria-live="polite">
    <span class="icon">check_circle</span>
    <span id="selCount">0 selected</span>
    <button id="clearSel" class="btn"><span class="icon">close</span>Clear</button>
    <button id="selectAll" class="btn"><span class="icon">done_all</span>Select All</button>
    <button id="btnSlide" class="btn"><span class="icon">play_arrow</span>Slideshow</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
    <div class="lb-top">
      <div style="display:flex;align-items:center;gap:8px">
        <button id="lbClose" class="lb-btn" title="Close (Esc)"><span class="icon">close</span></button>
        <span id="lbMeta" style="font-size:14px;color:#e5e7eb"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="lb-btn" title="Zoom out"><span class="icon">zoom_out</span></button>
        <button class="lb-btn" title="Zoom in"><span class="icon">zoom_in</span></button>
        <button class="lb-btn" title="Download"><span class="icon">download</span></button>
      </div>
    </div>
    <button id="lbPrev" class="lb-btn lb-nav lb-prev" title="Previous (←)"><span class="icon">chevron_left</span></button>
    <img id="lbImg" class="lb-img" alt="Photo" />
    <button id="lbNext" class="lb-btn lb-nav lb-next" title="Next (→)"><span class="icon">chevron_right</span></button>
  </div>

  <script>
  /* ---------- CONFIG ---------- */
  const BASE = "gallery/";     // image folder
  const EXT  = ".jpg";         // default extension

  // Tag your filenames
  const DATA = {
    nature:  ["Photo_6","Photo_7","Photo_16","Photo_24","Photo_26","Photo_41","Photo_47","Photo_48","Photo_54"],
    events:  ["Photo_10","Photo_11","Photo_12","Photo_13","Photo_27","Photo_42","Photo_43","Photo_44"],
    personal:["Photo_1","Photo_2","Photo_3","Photo_4","Photo_5","Photo_8","Photo_9","Photo_14","Photo_15","Photo_17","Photo_18","Photo_19","Photo_20","Photo_21","Photo_22","Photo_23","Photo_25","Photo_28","Photo_29","Photo_30","Photo_31","Photo_32","Photo_33","Photo_34","Photo_35","Photo_36","Photo_37","Photo_38","Photo_39","Photo_40","Photo_45","Photo_46","Photo_49","Photo_50","Photo_51","Photo_52","Photo_53","Photo_55","Photo_56","Photo_57","Photo_58"],
    academic:["Photo_12","Photo_29","Photo_30","Photo_41","Photo_43","Photo_44","Photo_47"],
    travel:  ["Photo_6","Photo_7","Photo_41","Photo_47","Photo_48","Photo_58"],
  };
  const toSrc = (name)=> `${BASE}${name}${EXT}`;
  const ALL = Object.entries(DATA).flatMap(([tag, files]) =>
    files.map(f => ({ src: toSrc(f), name: f, tag }))
  );

  /* ---------- STATE ---------- */
  let filter = "all";
  let density = 1;                 // toggles column width
  let selection = new Set();
  let view = [];                   // filtered list
  let lbIndex = -1;                // lightbox index
  let slideshowTimer = null;

  /* ---------- ELEMENTS ---------- */
  const photosEl   = document.getElementById('photos');
  const selectbar  = document.getElementById('selectbar');
  const selCount   = document.getElementById('selCount');
  const clearSel   = document.getElementById('clearSel');
  const searchInput= document.getElementById('searchInput');
  const clearSearch= document.getElementById('clearSearch');

  /* ---------- OBSERVER (lazy + reveal) ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target.querySelector('img.thumb');
        if (img && img.dataset.src) {
          img.src = img.dataset.src;
          img.onload = () => e.target.classList.add('loaded');
          img.onerror = () => {
            if (!img.dataset.triedPng){
              img.dataset.triedPng = "1";
              img.src = img.dataset.src.replace(/\.jpg$/i, ".png");
            }
          };
          img.removeAttribute('data-src');
        }
        io.unobserve(e.target);
      }
    });
  }, {rootMargin:'300px'});

  /* ---------- RENDER ---------- */
  function render(list){
    photosEl.innerHTML = "";
    const frag = document.createDocumentFragment();

    list.forEach((it, i) => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'item';
      a.dataset.index = i;
      a.dataset.name = it.name.toLowerCase();
      a.dataset.tag  = it.tag;

      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = it.name;
      img.loading = 'lazy'; img.decoding='async';
      img.dataset.src = it.src;

      // caption
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = `${it.name.replace('Photo_','Photo ')} · ${it.tag}`;

      // overlay select handle
      const overlay = document.createElement('div'); overlay.className='overlay';
      const circle = document.createElement('div'); circle.className='circle';
      circle.addEventListener('click', (ev)=>{ ev.stopPropagation(); ev.preventDefault(); toggleSelect(it.src, a); });
      overlay.appendChild(circle);

      a.appendChild(img);
      a.appendChild(cap);
      a.appendChild(overlay);

      // clicks
      a.addEventListener('click', (ev)=>{ ev.preventDefault(); openLightbox(i); });

      frag.appendChild(a);
      io.observe(a);
    });

    photosEl.appendChild(frag);
  }

  function refresh(){
    const q = searchInput.value.trim().toLowerCase();
    view = ALL.filter(x => (filter==='all' || x.tag===filter) && (!q || x.name.toLowerCase().includes(q)));
    render(view);
  }

  /* ---------- SELECTION ---------- */
  function toggleSelect(key, node){
    if (selection.has(key)) selection.delete(key); else selection.add(key);
    node.classList.toggle('selected');
    selCount.textContent = `${selection.size} selected`;
    selectbar.classList.toggle('show', selection.size>0);
  }
  clearSel.addEventListener('click', ()=>{
    selection.clear();
    document.querySelectorAll('.item.selected').forEach(n=>n.classList.remove('selected'));
    selectbar.classList.remove('show');
    selCount.textContent = '0 selected';
  });
  document.getElementById('selectAll').addEventListener('click', ()=>{
    selection.clear();
    document.querySelectorAll('.item').forEach(node=>{
      const img = node.querySelector('img.thumb');
      const key = img ? (img.src || img.dataset.src) : null;
      node.classList.add('selected');
      if (key) selection.add(key);
    });
    selCount.textContent = `${selection.size} selected`;
    selectbar.classList.add('show');
  });

  /* ---------- FILTERS & SEARCH ---------- */
  document.getElementById('chips').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip'); if(!btn) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active'); filter = btn.dataset.chip; refresh();
  });
  searchInput.addEventListener('input', ()=>{
    clearSearch.style.display = searchInput.value ? 'inline-block' : 'none';
    refresh();
  });
  clearSearch.addEventListener('click', ()=>{ searchInput.value=''; clearSearch.style.display='none'; refresh(); });

  /* ---------- DENSITY ---------- */
  document.getElementById('densityBtn').addEventListener('click', ()=>{
    density = density === 1 ? 0.86 : 1;
    const base = Math.round(280 * density);
    document.documentElement.style.setProperty('--colw', base + 'px');
  });

  /* ---------- LIGHTBOX ---------- */
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lbImg');
  const lbMeta  = document.getElementById('lbMeta');
  const lbPrev  = document.getElementById('lbPrev');
  const lbNext  = document.getElementById('lbNext');
  const lbClose = document.getElementById('lbClose');

  function openLightbox(i){
    lbIndex = i; const it = view[lbIndex]; if(!it) return;
    lbImg.src = it.src; lbMeta.textContent = `${it.name} · ${it.tag}`;
    lb.classList.add('open');
  }
  function closeLightbox(){
    lb.classList.remove('open');
    lbImg.removeAttribute('src');
    if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; document.getElementById('btnSlide').innerHTML = '<span class="icon">play_arrow</span>Slideshow'; }
  }
  function nav(step){
    if(!view.length) return;
    lbIndex = (lbIndex + step + view.length) % view.length;
    const it = view[lbIndex]; lbImg.src = it.src; lbMeta.textContent = `${it.name} · ${it.tag}`;
  }
  lbPrev.addEventListener('click', ()=>nav(-1));
  lbNext.addEventListener('click', ()=>nav(1));
  lbClose.addEventListener('click', closeLightbox);
  document.getElementById('btnSlide').addEventListener('click', ()=>{
    if (slideshowTimer){
      clearInterval(slideshowTimer); slideshowTimer = null;
      document.getElementById('btnSlide').innerHTML = '<span class="icon">play_arrow</span>Slideshow';
    } else {
      if (!view.length) return;
      if (!lb.classList.contains('open')) openLightbox(0);
      document.getElementById('btnSlide').innerHTML = '<span class="icon">pause</span>Stop';
      slideshowTimer = setInterval(()=> nav(1), 2600);
    }
  });
  lb.addEventListener('click', (e)=>{ if(e.target===lb) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowRight') nav(1);
    if(e.key==='ArrowLeft')  nav(-1);
  });

  /* ---------- BOOT ---------- */
  refresh();

  // Soft-disable “Collections” demo actions (no alerts)
  document.querySelectorAll(".list a").forEach((link) => link.addEventListener("click", (e)=> e.preventDefault()));
  </script>
</body>
</html>
