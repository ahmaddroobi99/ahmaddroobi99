<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ahmad Droobi | Photos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Material+Symbols+Rounded:FILL@0..1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;           /* dark default (like Google Photos) */
      --surface: #171717;
      --text: #e6e6e6;
      --muted: #a1a1aa;
      --brand: #8ab4f8;        /* Google-ish blue in dark */
      --chip: #262626;
      --accent: #8c1515;       /* your brand accent */
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#fafafa; --surface:#ffffff; --text:#1f2937; --muted:#6b7280; --brand:#1a73e8; --chip:#f3f4f6; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}

    /* Top App Bar */
    .appbar{position:sticky;top:0;z-index:20;background:var(--surface);display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
    .logo-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4285f4,#34a853 55%,#fbbc05 85%,#ea4335);box-shadow:0 0 0 2px rgba(255,255,255,.06) inset}
    .search{flex:1;display:flex;align-items:center;gap:10px;background:var(--chip);padding:10px 12px;border-radius:999px}
    .search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
    .kv{display:flex;align-items:center;gap:8px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--chip);color:var(--text);border:1px solid rgba(255,255,255,.06);cursor:pointer;user-select:none}
    .btn:hover{filter:brightness(1.08)}
    .icon{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 600,"opsz" 24;vertical-align:middle;font-size:20px}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#003366,#8c1515)}

    /* Content Shell */
    .shell{display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1600px;margin:0 auto;padding:18px}
    @media (max-width: 1080px){.shell{grid-template-columns:1fr}}

    /* Left rail (folders/filters) */
    .rail{display:flex;flex-direction:column;gap:10px}
    .rail .card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px}
    .rail .card h3{margin:0;padding:14px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .rail .list{padding:6px}
    .rail .list a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;color:var(--text);text-decoration:none}
    .rail .list a:hover{background:var(--chip)}

    /* Chips */
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
    .chip{background:var(--chip);border:1px solid rgba(255,255,255,.06);color:var(--text);padding:8px 12px;border-radius:999px;font-size:12px;cursor:pointer}
    .chip.active{outline:2px solid var(--brand)}

    /* Masonry Grid (CSS columns like Google Photos) */
    .photos{column-width: 280px; column-gap: 12px}
    @media (max-width: 1200px){.photos{column-width: 240px}}
    @media (max-width: 900px){.photos{column-width: 200px}}
    @media (max-width: 640px){.photos{column-width: 160px}}

    .item{break-inside:avoid;display:block;margin:0 0 12px;position:relative;border-radius:12px;overflow:hidden;background:#000}
    .thumb{width:100%;display:block;height:auto;opacity:0;transition:opacity .3s ease}
    .item.loaded .thumb{opacity:1}

    /* Hover overlays like Photos (check/select & quick actions) */
    .overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:space-between;padding:8px;opacity:0;transition:opacity .15s ease;pointer-events:none}
    .item:hover .overlay{opacity:1}
    .select{pointer-events:auto}
    .circle{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35)}
    .item.selected .circle{background:#1a73e8;border-color:#1a73e8}
    .quick{display:flex;gap:6px}
    .quick .qbtn{pointer-events:auto;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-radius:8px;padding:6px;display:flex}

    /* Selection bar (bottom) */
    .selectbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;align-items:center;gap:10px;padding:10px 12px;z-index:25}
    .selectbar.show{display:flex}

    /* Lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:30}
    .lightbox.open{display:flex}
    .lb-img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;color:#fff}
    .lb-prev{left:24px}.lb-next{right:24px}
    .lb-btn{background:rgba(255,255,255,.1);padding:10px;border-radius:999px;cursor:pointer}
    .lb-top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}

    /* Date headers (optional) */
    .date-tag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;padding:4px 8px;border-radius:999px;font-size:11px}
  </style>
</head>
<body>
  <!-- App Bar -->
  <header class="appbar">
    <div class="logo"><span class="logo-badge" aria-hidden></span><span>Photos</span></div>
    <div class="search" role="search">
      <span class="icon">search</span>
      <input id="searchInput" placeholder="Search your photos (name, tag)…" autocomplete="off" />
      <span id="clearSearch" class="icon" style="cursor:pointer;display:none">close</span>
    </div>
    <div class="kv">
      <button id="densityBtn" class="btn" title="Toggle density"><span class="icon">density_small</span><span class="hide-sm">Density</span></button>
      <button class="btn" title="Upload (wire action)"><span class="icon">upload</span><span class="hide-sm">Upload</span></button>
      <div class="avatar" title="Account"></div>
    </div>
  </header>

  <main class="shell">
    <!-- Left rail (filters/collections) -->
    <aside class="rail">
      <div class="card">
        <h3>Filters</h3>
        <div class="list">
          <div class="chips" id="chips">
            <button class="chip active" data-chip="all">All</button>
            <button class="chip" data-chip="nature">Nature</button>
            <button class="chip" data-chip="events">Events</button>
            <button class="chip" data-chip="personal">Personal</button>
            <button class="chip" data-chip="academic">Academic</button>
            <button class="chip" data-chip="travel">Travel</button>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>Collections</h3>
        <div class="list">
          <a href="#"><span class="icon">photo_library</span>All Photos</a>
          <a href="#"><span class="icon">favorite</span>Favorites</a>
          <a href="#"><span class="icon">people_alt</span>People</a>
          <a href="#"><span class="icon">location_on</span>Places</a>
          <a href="#"><span class="icon">event</span>Albums</a>
        </div>
      </div>
    </aside>

    <!-- Photo stream (masonry) -->
    <section>
      <div class="photos" id="photos"></div>
    </section>
  </main>

  <!-- Selection bar -->
  <div id="selectbar" class="selectbar" role="status" aria-live="polite">
    <span class="icon">check_circle</span>
    <span id="selCount">0 selected</span>
    <button id="clearSel" class="btn"><span class="icon">close</span>Clear</button>
    <button class="btn"><span class="icon">download</span>Download</button>
    <button class="btn"><span class="icon">share</span>Share</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
    <div class="lb-top">
      <div style="display:flex;align-items:center;gap:8px">
        <button id="lbClose" class="lb-btn" title="Close (Esc)"><span class="icon">close</span></button>
        <span id="lbMeta" style="font-size:14px;color:#e5e7eb"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="lb-btn" title="Zoom out"><span class="icon">zoom_out</span></button>
        <button class="lb-btn" title="Zoom in"><span class="icon">zoom_in</span></button>
        <button class="lb-btn" title="Download"><span class="icon">download</span></button>
      </div>
    </div>
    <button id="lbPrev" class="lb-btn lb-nav lb-prev" title="Previous (←)"><span class="icon">chevron_left</span></button>
    <img id="lbImg" class="lb-img" alt="Photo" />
    <button id="lbNext" class="lb-btn lb-nav lb-next" title="Next (→)"><span class="icon">chevron_right</span></button>
  </div>

  <script>
    /**
     * CONFIG — replace with your actual images. You can nest by category.
     */
    const DATA = {
      nature: ["IMG_20211013_162450.jpg","IMG_20211013_214050.jpg"],
      events: ["IMG_20211023_200358.jpg","IMG_20211112_161725.jpg"],
      personal: ["IMG_20211203_150027.jpg","IMG_20211226_142401.jpg"],
      academic: ["IMG_20221112_151501.jpg","IMG_20221205_133839.jpg"],
      travel: ["IMG_20230123_151642.jpg","IMG_20230723_185251.jpg"],
    };

    // Flatten to master list with tags for filtering
    const ALL = Object.entries(DATA).flatMap(([tag, files]) => files.map(f => ({src:`gallery/${f}`, name:f, tag})));

    // Runtime state
    let density = 1; // 1 = default, 0.85 = compact
    let filter = "all";
    let selection = new Set();
    let currentIndex = -1; // for lightbox
    let view = []; // filtered view

    // Elements
    const photosEl = document.getElementById('photos');
    const selectbar = document.getElementById('selectbar');
    const selCount = document.getElementById('selCount');
    const clearSel = document.getElementById('clearSel');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    // Build masonry items with lazy loading & overlays
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const img = e.target.querySelector('img.thumb');
          if (img && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
          e.target.classList.add('loaded');
          io.unobserve(e.target);
        }
      });
    }, {rootMargin: '300px'});

    function render(list) {
      photosEl.innerHTML = '';
      list.forEach((it, i) => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'item';
        a.dataset.index = i;
        a.dataset.name = it.name.toLowerCase();
        a.dataset.tag = it.tag;

        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = it.name;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.dataset.src = it.src; // lazy until intersect
        a.appendChild(img);

        // Overlay (select + quick actions)
        const overlay = document.createElement('div');
        overlay.className = 'overlay';

        const left = document.createElement('div');
        left.className = 'select';
        const circle = document.createElement('div');
        circle.className = 'circle';
        left.appendChild(circle);

        const right = document.createElement('div');
        right.className = 'quick';
        right.innerHTML = `<div class="qbtn" title="Info"><span class="icon">info</span></div>
                           <div class="qbtn" title="Favorite"><span class="icon">favorite</span></div>`;
        overlay.appendChild(left);
        overlay.appendChild(right);
        a.appendChild(overlay);

        // Optional date badge (derive from filename if you embed dates)
        // const tag = document.createElement('span'); tag.className='date-tag'; tag.textContent='Oct 2023'; a.appendChild(tag);

        // Behaviors
        a.addEventListener('click', (ev) => {
          ev.preventDefault();
          openLightbox(i);
        });
        a.addEventListener('mouseenter', () => a.classList.add('hover'));
        a.addEventListener('mouseleave', () => a.classList.remove('hover'));

        // Selection toggle (click on circle)
        circle.addEventListener('click', (ev) => {
          ev.stopPropagation();
          toggleSelect(it.src, a);
        });

        photosEl.appendChild(a);
        io.observe(a);
      });
    }

    function refresh() {
      const q = searchInput.value.trim().toLowerCase();
      view = ALL.filter(x => (filter==='all' || x.tag===filter) && (!q || x.name.toLowerCase().includes(q)));
      render(view);
    }

    // Selection UX
    function toggleSelect(key, node) {
      if (selection.has(key)) selection.delete(key); else selection.add(key);
      node.classList.toggle('selected');
      selCount.textContent = `${selection.size} selected`;
      selectbar.classList.toggle('show', selection.size>0);
    }
    clearSel.addEventListener('click', () => {
      selection.clear();
      document.querySelectorAll('.item.selected').forEach(n => n.classList.remove('selected'));
      selectbar.classList.remove('show');
      selCount.textContent = '0 selected';
    });

    // Chips (filters)
    document.getElementById('chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.chip;
      refresh();
    });

    // Search
    searchInput.addEventListener('input', () => {
      clearSearch.style.display = searchInput.value ? 'inline-block' : 'none';
      refresh();
    });
    clearSearch.addEventListener('click', () => { searchInput.value=''; clearSearch.style.display='none'; refresh(); });

    // Density toggle
    document.getElementById('densityBtn').addEventListener('click', () => {
      density = density === 1 ? 0.85 : 1;
      document.documentElement.style.setProperty('--density', density);
      // programmatically tweak column width for compact mode
      const base = Math.round(280 * density);
      const style = document.createElement('style');
      style.textContent = `.photos{column-width:${base}px}`;
      document.head.appendChild(style);
    });

    // Lightbox mechanics
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbMeta = document.getElementById('lbMeta');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');
    const lbClose = document.getElementById('lbClose');

    function openLightbox(i){
      currentIndex = i;
      const it = view[currentIndex];
      if (!it) return;
      lbImg.src = it.src;
      lbMeta.textContent = `${it.name} · ${it.tag}`;
      lb.classList.add('open');
    }
    function closeLightbox(){ lb.classList.remove('open'); lbImg.removeAttribute('src'); }
    function nav(step){
      if (!view.length) return;
      currentIndex = (currentIndex + step + view.length) % view.length;
      lbImg.src = view[currentIndex].src;
      lbMeta.textContent = `${view[currentIndex].name} · ${view[currentIndex].tag}`;
    }

    lbPrev.addEventListener('click', ()=>nav(-1));
    lbNext.addEventListener('click', ()=>nav(1));
    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e)=>{ if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', (e)=>{
      if (!lb.classList.contains('open')) return;
      if (e.key==='Escape') closeLightbox();
      if (e.key==='ArrowRight') nav(1);
      if (e.key==='ArrowLeft') nav(-1);
    });

    // Bootstrap
    refresh();
  </script>
</body>
</html>
