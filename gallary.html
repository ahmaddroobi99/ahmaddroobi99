<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <title>Ahmad Droobi | Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/font-awesome.css">
    <style>
        /* Reset and General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: linear-gradient(180deg, #001f3f, #003366);
            color: white;
            padding: 30px 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .sidebar h3 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ecf0f1;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: #ecf0f1;
            text-decoration: none;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 5px;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        .sidebar a:hover, .sidebar .active {
            background: #8c1515;
            transform: translateX(5px);
        }

        /* Sidebar Menu Styles */
        .sidebar-menu {
            background: linear-gradient(180deg, #001f3f, #003366);
            color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .sidebar-menu .profile-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .sidebar-menu .profile-description {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 10px;
        }

        .sidebar-menu .skills {
            margin-top: 20px;
        }

        .sidebar-menu .skills h4 {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .sidebar-menu .skills ul {
            list-style: none;
            padding: 0;
        }

        .sidebar-menu .skills ul li {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 5px;
        }

        /* Main Content */
        .main {
            margin-left: 270px;
            padding: 40px;
            min-height: 100vh;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 30px;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 4px;
            background: #8c1515;
            border-radius: 2px;
        }

        /* Updated styles for categorized gallery */
        .category-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0 10px;
            border-bottom: 2px solid #8c1515;
            padding-bottom: 5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Lightbox Styling */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border: 5px solid white;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            padding: 20px;
            transition: color 0.3s ease;
        }

        .lightbox-nav:hover {
            color: #8c1515;
        }

        .prev { left: 20px; }
        .next { right: 20px; }

        /* Updated styles for social icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .social-icons .icon {
            font-size: 2rem;
            color: #ffffff;
            background-color: #003366;
            border-radius: 50%;
            padding: 10px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .social-icons .icon:hover {
            transform: scale(1.2) rotate(10deg);
            background-color: #0073b1;
        }

        .github-icon { color: #333; }
        .linkedin-icon { color: #0073b1; }
        .scholar-icon { color: #d14836; }

        /* Toggle Button Styles */
        .category-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toggle-button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .toggle-button:hover {
            background-color: #0073b1;
            transform: scale(1.1);
        }

        .toggle-button:active {
            background-color: #005f8a;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
            .gallery-item img {
                height: 180px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main {
                margin-left: 0;
                padding: 20px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .gallery-item img {
                height: 140px;
            }
        }

        /* Footer Styling */
        #footer {
            background: #001f3f;
            color: white;
            padding: 20px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        .copyright-text {
            margin: 0;
            font-size: 14px;
            text-align: center;
            color: #d1d1d1;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Ahmad Droobi</h3>
        <a href="index.html"><i class="fa fa-home fa-fw"></i> Home</a>
        <a href="education.html"><i class="fa fa-graduation-cap fa-fw"></i> Education</a>
        <a href="publications.html"><i class="fa fa-file fa-fw"></i> Publications</a>
        <a href="experience.html"><i class="fa fa-suitcase fa-fw"></i> Experience</a>
        <a href="awards.html"><i class="fa fa-star fa-fw"></i> Awards</a>
        <a href="gallery.html" class="active"><i class="fa fa-picture-o fa-fw"></i> Gallery</a>

        <!-- Unified sidebar content -->
        <div class="sidebar-menu">
            <div class="top-section">
                <h3 class="profile-title">Ahmad Droobi</h3>
                <p class="profile-description">Graduate Research Assistant</p>
                <div class="skills">
                    <h4>Expertise & Skills</h4>
                    <ul>
                        <li>Machine Learning</li>
                        <li>Data Analysis</li>
                        <li>Scientific Computing</li>
                        <li>Programming (Python, MATLAB)</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h1>Gallery</h1>

        <!-- Toggle Buttons for Categories -->
        <div class="category-toggle">
            <button class="toggle-button" onclick="toggleCategory('nature-gallery')">Nature</button>
            <button class="toggle-button" onclick="toggleCategory('events-gallery')">Events</button>
            <button class="toggle-button" onclick="toggleCategory('personal-gallery')">Personal</button>
            <button class="toggle-button" onclick="toggleCategory('academic-gallery')">Academic</button>
            <button class="toggle-button" onclick="toggleCategory('travel-gallery')">Travel</button>
        </div>

        <!-- Nature Category -->
        <div class="gallery" id="nature-gallery" style="display: none;">
            <!-- Images for Nature -->
        </div>

        <!-- Events Category -->
        <div class="gallery" id="events-gallery" style="display: none;">
            <!-- Images for Events -->
        </div>

        <!-- Personal Category -->
        <div class="gallery" id="personal-gallery" style="display: none;">
            <!-- Images for Personal -->
        </div>

        <!-- Academic Category -->
        <div class="gallery" id="academic-gallery" style="display: none;">
            <!-- Images for Academic -->
        </div>

        <!-- Travel Category -->
        <div class="gallery" id="travel-gallery" style="display: none;">
            <!-- Images for Travel -->
        </div>

        <!-- Updated social icons section -->
        <div class="social-icons">
            <a href="https://github.com/your-github" target="_blank" class="icon github-icon" title="GitHub">
                <i class="fa fa-github"></i>
            </a>
            <a href="https://linkedin.com/in/your-linkedin" target="_blank" class="icon linkedin-icon" title="LinkedIn">
                <i class="fa fa-linkedin"></i>
            </a>
            <a href="https://scholar.google.com/citations?user=your-google-scholar-id" target="_blank" class="icon scholar-icon" title="Google Scholar">
                <i class="ai ai-google-scholar"></i>
            </a>
        </div>
    </div>

    <!-- Lightbox Viewer -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-nav prev" onclick="navigate(-1)">&#10094;</span>
        <img id="lightbox-img" src="" alt="Full View">
        <span class="lightbox-nav next" onclick="navigate(1)">&#10095;</span>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        // Categorized images
        const categories = {
            nature: ["IMG_20211013_162450.jpg", "IMG_20211013_214050.jpg"],
            events: ["IMG_20211023_200358.jpg", "IMG_20211112_161725.jpg"],
            personal: ["IMG_20211203_150027.jpg", "IMG_20211226_142401.jpg"],
            academic: ["IMG_20221112_151501.jpg", "IMG_20221205_133839.jpg"],
            travel: ["IMG_20230123_151642.jpg", "IMG_20230723_185251.jpg"]
        };

        Object.keys(categories).forEach(category => {
            const galleryContainer = document.getElementById(`${category}-gallery`);
            categories[category].forEach(filename => {
                const container = document.createElement("div");
                container.className = "gallery-item";
                const img = document.createElement("img");
                img.src = `gallery/${filename}`;
                img.alt = filename;
                container.appendChild(img);
                galleryContainer.appendChild(container);
            });
        });

        const images = [
            "IMG_20211013_162450.jpg", "IMG_20211013_214050.jpg", "IMG_20211023_200358.jpg",
            "IMG_20211112_161725.jpg", "IMG_20211203_150027.jpg", "IMG_20211226_142401.jpg",
            "IMG_20221130_110645.jpg", "IMG_20221112_151501.jpg", "IMG_20221205_133839.jpg",
            "IMG_20230123_151642.jpg", "IMG_20230723_185251.jpg", "IMG_20230910_175256.jpg",
            "IMG_20230910_175308.jpg", "IMG_20231230_181400.jpg", "IMG_20240118_181014.jpg",
            "IMG_20240118_181037.jpg", "IMG_20240324_130653.jpg", "IMG_20240414_200436.jpg",
            "IMG_20240528_200753.jpg", "IMG_20240529_012339.jpg",
            "Screenshot_2022-02-09-21-44-25-670_com.google.android.apps.photos.jpg",
            "Screenshot_2022-02-09-21-56-59-803_com.google.android.apps.photos.jpg",
            "Screenshot_2022-02-09-21-58-47-508_com.google.android.apps.photos.jpg",
            "Screenshot_2022-02-09-21-59-42-879_com.google.android.apps.photos.jpg",
            "Screenshot_2022-02-22-01-18-147_com.google.android.apps.photos.jpg",
            "Screenshot_2022-09-10-10-11-28-565_com.android.chrome.jpg"
        ];

        const galleryContainer = document.getElementById("gallery");
        let currentIndex = 0;

        images.forEach((filename, index) => {
            const container = document.createElement("div");
            container.className = "gallery-item";
            const img = document.createElement("img");
            img.src = `gallery/${filename}`;  // Updated path to gallery/img/
            img.alt = filename;
            img.onclick = () => openLightbox(index);
            const caption = document.createElement("div");
            caption.className = "caption";
            caption.textContent = filename;
            container.appendChild(img);
            container.appendChild(caption);
            galleryContainer.appendChild(container);
        });

        function openLightbox(index) {
            event.stopPropagation();
            currentIndex = index;
            document.getElementById("lightbox-img").src = `gallery/${images[currentIndex]}`;
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }

        function navigate(step) {
            event.stopPropagation();
            currentIndex = (currentIndex + step + images.length) % images.length;
            document.getElementById("lightbox-img").src = `gallery/${images[currentIndex]}`;
        }

        document.addEventListener("keydown", (e) => {
            if (document.getElementById("lightbox").style.display === "flex") {
                if (e.key === "ArrowRight") navigate(1);
                if (e.key === "ArrowLeft") navigate(-1);
                if (e.key === "Escape") closeLightbox();
            }
        });

        // Function to toggle category visibility
        function toggleCategory(categoryId) {
            const categories = document.querySelectorAll('.gallery');
            categories.forEach(category => {
                if (category.id === categoryId) {
                    category.style.display = category.style.display === 'none' ? 'grid' : 'none';
                } else {
                    category.style.display = 'none';
                }
            });
        }
    </script>

    <!-- Footer -->
    <div class="row" id="footer">
        <div class="col-md-12 text-center">
            <p class="copyright-text">© 1999–2026 Ahmad Droobi</p>
        </div>
    </div>
</body>
</html>
