<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ahmad Droobi | Photos</title>

  <!-- Fonts / Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Material+Symbols+Rounded:FILL@0..1,GRAD@0..200,opsz@20..48,wght@300..700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#0f0f0f; --surface:#171717; --text:#e6e6e6; --muted:#a1a1aa;
      --brand:#8ab4f8; --chip:#262626; --accent:#8c1515;
      --colw:280px; --gap:12px;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#fafafa; --surface:#ffffff; --text:#1f2937; --muted:#6b7280; --brand:#1a73e8; --chip:#f3f4f6; }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}

    /* Top App Bar */
    .appbar{position:sticky;top:0;z-index:20;background:var(--surface);display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
    .logo-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4285f4,#34a853 55%,#fbbc05 85%,#ea4335);box-shadow:0 0 0 2px rgba(255,255,255,.06) inset}
    .search{flex:1;display:flex;align-items:center;gap:10px;background:var(--chip);padding:10px 12px;border-radius:999px}
    .search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
    .kv{display:flex;align-items:center;gap:8px}
    .btn {
      background: linear-gradient(90deg, #6aa3ff, #64d2ff);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: none;
    }

    .btn:hover {
      background: linear-gradient(90deg, #64d2ff, #6aa3ff);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transform: translateY(-2px);
    }

    .btn .icon {
      font-size: 18px;
      color: white;
    }
    .icon{font-family:"Material Symbols Rounded";font-variation-settings:"FILL" 0,"wght" 600,"opsz" 24;vertical-align:middle;font-size:20px}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#003366,#8c1515)}

    /* Shell */
    .shell{display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1600px;margin:0 auto;padding:18px}
    @media (max-width:1080px){.shell{grid-template-columns:1fr}}

    /* Left rail */
    .rail{display:flex;flex-direction:column;gap:10px}
    .rail .card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px}
    .rail .card h3{margin:0;padding:14px 14px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .rail .list{padding:6px}
    .rail .list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text);
      background: var(--chip);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .rail .list a:hover {
      background: var(--surface);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .rail .list a .icon {
      font-size: 18px;
      color: var(--text);
    }

    /* Chips */
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px;padding:0 8px 10px}
    .chip {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chip:hover {
      background: #e0e0e0;
      border-color: #ccc;
    }

    .chip.active {
      background: #6aa3ff;
      color: white;
      border-color: #6aa3ff;
    }

    /* Masonry (CSS columns) */
    .photos{column-width:var(--colw); column-gap:var(--gap)}
    @media (max-width:1200px){.photos{--colw:240px}}
    @media (max-width:900px){.photos{--colw:200px}}
    @media (max-width:640px){.photos{--colw:160px}}

    .item{break-inside:avoid;display:block;margin:0 0 var(--gap);position:relative;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.04)}
    .thumb{width:100%;display:block;height:auto;opacity:0;transition:opacity .28s ease}
    .item.loaded .thumb{opacity:1}

    /* Hover overlay */
    .overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:space-between;padding:8px;opacity:0;transition:opacity .15s ease;pointer-events:none}
    .item:hover .overlay{opacity:1}
    .select{pointer-events:auto}
    .circle{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35)}
    .item.selected .circle{background:#1a73e8;border-color:#1a73e8}
    .quick{display:flex;gap:6px}
    .quick .qbtn{pointer-events:auto;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-radius:8px;padding:6px;display:flex}

    /* Selection bar */
    .selectbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;align-items:center;gap:10px;padding:10px 12px;z-index:25}
    .selectbar.show{display:flex}

    /* Lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;z-index:30}
    .lightbox.open{display:flex}
    .lb-img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .lb-nav{position:fixed;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;color:#fff}
    .lb-prev{left:24px}.lb-next{right:24px}
    .lb-btn{background:rgba(255,255,255,.1);padding:10px;border-radius:999px;cursor:pointer}
    .lb-top{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;color:#fff}

    /* Example of an image with a modernized button */
    .image-container {
      position: relative;
      display: inline-block;
      border-radius: 8px;
      overflow: hidden;
    }

    .image-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .image-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- App Bar -->
  <header class="appbar">
    <div class="logo"><span class="logo-badge" aria-hidden></span><span>Photos</span></div>
    <div class="search" role="search">
      <span class="icon">search</span>
      <input id="searchInput" placeholder="Search your photos (name, tag)…" autocomplete="off" />
      <span id="clearSearch" class="icon" style="cursor:pointer;display:none">close</span>
    </div>
    <div class="kv">
      <button id="densityBtn" class="btn" title="Toggle density"><span class="icon">density_small</span> Density</button>
      <button class="btn" title="Upload (wire action)"><span class="icon">upload</span> Upload</button>
      <div class="avatar" title="Account"></div>
    </div>
  </header>

  <main class="shell">
    <!-- Left rail -->
    <aside class="rail">
      <div class="card">
        <h3>Filters</h3>
        <div class="chips" id="chips">
          <button class="chip active" data-chip="all">All</button>
          <button class="chip" data-chip="nature">Nature</button>
          <button class="chip" data-chip="events">Events</button>
          <button class="chip" data-chip="personal">Personal</button>
          <button class="chip" data-chip="academic">Academic</button>
          <button class="chip" data-chip="travel">Travel</button>
        </div>
      </div>
      <div class="card">
        <h3>Collections</h3>
        <div class="list">
          <a href="#" id="collection-all"><span class="icon">photo_library</span> All Photos</a>
          <a href="#" id="collection-favorites"><span class="icon">favorite</span> Favorites</a>
          <a href="#" id="collection-people"><span class="icon">people_alt</span> People</a>
          <a href="#" id="collection-places"><span class="icon">location_on</span> Places</a>
          <a href="#" id="collection-albums"><span class="icon">event</span> Albums</a>
        </div>
      </div>
    </aside>

    <!-- Stream -->
    <section>
      <div class="photos" id="photos"></div>
    </section>
  </main>

  <!-- Selection bar -->
  <div id="selectbar" class="selectbar" role="status" aria-live="polite">
    <span class="icon">check_circle</span>
    <span id="selCount">0 selected</span>
    <button id="clearSel" class="btn"><span class="icon">close</span>Clear</button>
    <button class="btn"><span class="icon">download</span>Download</button>
    <button class="btn"><span class="icon">share</span>Share</button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
    <div class="lb-top">
      <div style="display:flex;align-items:center;gap:8px">
        <button id="lbClose" class="lb-btn" title="Close (Esc)"><span class="icon">close</span></button>
        <span id="lbMeta" style="font-size:14px;color:#e5e7eb"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="lb-btn" title="Zoom out"><span class="icon">zoom_out</span></button>
        <button class="lb-btn" title="Zoom in"><span class="icon">zoom_in</span></button>
        <button class="lb-btn" title="Download"><span class="icon">download</span></button>
      </div>
    </div>
    <button id="lbPrev" class="lb-btn lb-nav lb-prev" title="Previous (←)"><span class="icon">chevron_left</span></button>
    <img id="lbImg" class="lb-img" alt="Photo" />
    <button id="lbNext" class="lb-btn lb-nav lb-next" title="Next (→)"><span class="icon">chevron_right</span></button>
  </div>

  <script>
  /* ---------- CONFIG ---------- */
  const BASE = "gallery/";      // image folder
  const EXT  = ".jpg";          // default extension

  // Map your filenames into categories (from your screenshot)
  const DATA = {
    nature:  ["Photo_6","Photo_7","Photo_16","Photo_24","Photo_26","Photo_41","Photo_47","Photo_48","Photo_54"],
    events:  ["Photo_10","Photo_11","Photo_12","Photo_13","Photo_27","Photo_42","Photo_43","Photo_44"],
    personal:["Photo_1","Photo_2","Photo_3","Photo_4","Photo_5","Photo_8","Photo_9","Photo_14","Photo_15","Photo_17","Photo_18","Photo_19","Photo_20","Photo_21","Photo_22","Photo_23","Photo_25","Photo_28","Photo_29","Photo_30","Photo_31","Photo_32","Photo_33","Photo_34","Photo_35","Photo_36","Photo_37","Photo_38","Photo_39","Photo_40","Photo_45","Photo_46","Photo_49","Photo_50","Photo_51","Photo_52","Photo_53","Photo_55","Photo_56","Photo_57","Photo_58"],
    academic:["Photo_12","Photo_29","Photo_30","Photo_41","Photo_43","Photo_44","Photo_47"],
    travel:  ["Photo_6","Photo_7","Photo_41","Photo_47","Photo_48","Photo_58"],
  };

  /* ---------- BUILD FLAT VIEW ---------- */
  const toSrc = (name)=> `${BASE}${name}${EXT}`;
  const ALL = Object.entries(DATA).flatMap(([tag, files]) =>
    files.map(f => ({ src: toSrc(f), name: f, tag }))
  );

  /* ---------- STATE ---------- */
  let filter = "all";
  let density = 1;                 // toggles column width
  let selection = new Set();
  let view = [];                   // filtered list
  let lbIndex = -1;                // lightbox index over "view"

  /* ---------- ELEMENTS ---------- */
  const photosEl   = document.getElementById('photos');
  const selectbar  = document.getElementById('selectbar');
  const selCount   = document.getElementById('selCount');
  const clearSel   = document.getElementById('clearSel');
  const searchInput= document.getElementById('searchInput');
  const clearSearch= document.getElementById('clearSearch');

  /* ---------- LAZY LOAD OBSERVER ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const img = e.target.querySelector('img.thumb');
        if (img && img.dataset.src) {
          img.src = img.dataset.src;
          img.onload = () => e.target.classList.add('loaded');
          // jpg→png fallback
          img.onerror = () => {
            if (!img.dataset.triedPng){
              img.dataset.triedPng = "1";
              img.src = img.dataset.src.replace(/\.jpg$/i, ".png");
            }
          };
          img.removeAttribute('data-src');
        }
        io.unobserve(e.target);
      }
    });
  }, {rootMargin:'300px'});

  /* ---------- RENDER ---------- */
  function render(list){
    photosEl.innerHTML = "";
    const frag = document.createDocumentFragment();

    list.forEach((it, i) => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'item';
      a.dataset.index = i;
      a.dataset.name = it.name.toLowerCase();
      a.dataset.tag  = it.tag;

      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = it.name;
      img.loading = 'lazy'; img.decoding='async';
      img.dataset.src = it.src;
      a.appendChild(img);

      // Hover overlay
      const overlay = document.createElement('div'); overlay.className='overlay';
      const left = document.createElement('div'); left.className='select';
      const circle = document.createElement('div'); circle.className='circle';
      left.appendChild(circle);
      const right = document.createElement('div'); right.className='quick';
      right.innerHTML = `<div class="qbtn" title="Info"><span class="icon">info</span></div>
                         <div class="qbtn" title="Favorite"><span class="icon">favorite</span></div>`;
      overlay.appendChild(left); overlay.appendChild(right); a.appendChild(overlay);

      // Click handlers
      a.addEventListener('click', (ev)=>{ ev.preventDefault(); openLightbox(i); });
      circle.addEventListener('click', (ev)=>{ ev.stopPropagation(); toggleSelect(it.src, a); });

      frag.appendChild(a);
      io.observe(a);
    });

    photosEl.appendChild(frag);
  }

  function refresh(){
    const q = searchInput.value.trim().toLowerCase();
    view = ALL.filter(x => (filter==='all' || x.tag===filter) && (!q || x.name.toLowerCase().includes(q)));
    render(view);
  }

  /* ---------- SELECTION ---------- */
  function toggleSelect(key, node){
    if (selection.has(key)) selection.delete(key); else selection.add(key);
    node.classList.toggle('selected');
    selCount.textContent = `${selection.size} selected`;
    selectbar.classList.toggle('show', selection.size>0);
  }
  clearSel.addEventListener('click', ()=>{
    selection.clear();
    document.querySelectorAll('.item.selected').forEach(n=>n.classList.remove('selected'));
    selectbar.classList.remove('show');
    selCount.textContent = '0 selected';
  });

  /* ---------- FILTER CHIPS ---------- */
  document.getElementById('chips').addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip'); if(!btn) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active'); filter = btn.dataset.chip; refresh();
  });

  /* ---------- SEARCH ---------- */
  searchInput.addEventListener('input', ()=>{
    clearSearch.style.display = searchInput.value ? 'inline-block' : 'none';
    refresh();
  });
  clearSearch.addEventListener('click', ()=>{
    searchInput.value=''; clearSearch.style.display='none'; refresh();
  });

  /* ---------- DENSITY TOGGLE ---------- */
  document.getElementById('densityBtn').addEventListener('click', ()=>{
    density = density === 1 ? 0.85 : 1;
    const base = Math.round(280 * density);
    document.documentElement.style.setProperty('--colw', base + 'px');
  });

  /* ---------- LIGHTBOX ---------- */
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lbImg');
  const lbMeta  = document.getElementById('lbMeta');
  const lbPrev  = document.getElementById('lbPrev');
  const lbNext  = document.getElementById('lbNext');
  const lbClose = document.getElementById('lbClose');

  function openLightbox(i){
    lbIndex = i; const it = view[lbIndex]; if(!it) return;
    lbImg.src = it.src; lbMeta.textContent = `${it.name} · ${it.tag}`;
    lb.classList.add('open');
  }
  function closeLightbox(){ lb.classList.remove('open'); lbImg.removeAttribute('src'); }
  function nav(step){
    if(!view.length) return;
    lbIndex = (lbIndex + step + view.length) % view.length;
    const it = view[lbIndex]; lbImg.src = it.src; lbMeta.textContent = `${it.name} · ${it.tag}`;
  }
  lbPrev.addEventListener('click', ()=>nav(-1));
  lbNext.addEventListener('click', ()=>nav(1));
  lbClose.addEventListener('click', closeLightbox);
  lb.addEventListener('click', (e)=>{ if(e.target===lb) closeLightbox(); });
  document.addEventListener('keydown', (e)=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowRight') nav(1);
    if(e.key==='ArrowLeft')  nav(-1);
  });

  /* ---------- BOOT ---------- */
  refresh();

  // Example backend integration for left panel
  const collections = {
    all: "All Photos",
    favorites: "Favorites",
    people: "People",
    places: "Places",
    albums: "Albums",
  };

  document.querySelectorAll(".list a").forEach((link) => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      const id = link.id.replace("collection-", "");
      console.log(`Fetching data for ${collections[id]}...`);
      // Simulate backend call
      setTimeout(() => {
        alert(`Data for ${collections[id]} loaded successfully!`);
      }, 1000);
    });
  });
  </script>
</body>
</html>
