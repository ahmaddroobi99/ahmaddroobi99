<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Repository</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .hero__bg img {
      position: absolute;
      width: 120%;
      left: -10%;
      top: -5%;
      filter: saturate(120%) contrast(110%) brightness(90%);
      transform: translateX(0);
      animation: slideBackground 15s linear infinite;
    }

    @keyframes slideBackground {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-15%);
      }
    }

    .cards-container {
      display: flex;
      gap: 30px;
    }

    .flip-container {
      perspective: 1000px;
      width: 400px;
      height: 300px;
    }

    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }

    .flip-container:hover .flipper {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .front {
      background: rgba(0, 123, 255, 0.9);
      color: #fff;
    }

    .back {
      background: rgba(40, 167, 69, 0.9);
      color: #fff;
      transform: rotateY(180deg);
    }

    .back a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .back a:hover {
      color: #ffcc00;
      text-decoration: underline;
    }

    .flip-container:hover .front {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .flaming-effect {
      animation: flaming 2s infinite alternate;
    }

    @keyframes flaming {
      0% {
        box-shadow: 0 0 15px rgba(255, 69, 0, 0.8), 0 0 25px rgba(255, 140, 0, 0.6);
      }
      50% {
        box-shadow: 0 0 20px rgba(255, 99, 71, 1), 0 0 30px rgba(255, 165, 0, 0.8);
      }
      100% {
        box-shadow: 0 0 25px rgba(255, 69, 0, 1), 0 0 35px rgba(255, 140, 0, 0.8);
      }
    }
  </style>
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body>
  <header>
    <h1>Scientific Repository</h1>
  </header>
  <div class="hero__bg">
    <img src="img/prof.jpg" alt="Background Image">
  </div>
  <div class="cards-container">
    <div class="flip-container">
      <div class="flipper">
        <div class="front">
          <h2>PDF Documents</h2>
        </div>
        <div class="back">
          <ul>
            <li><a href="files/Ahmad_Droobi_CV_2026.pdf" target="_blank">Ahmad Droobi CV 2026</a></li>
            <li><a href="files/Ahmad_project_on_Generalization.pdf" target="_blank">Ahmad Project on Generalization</a></li>
            <li><a href="files/FTF.pdf" target="_blank">FTF</a></li>
            <li><a href="files/Math_ML.pdf" target="_blank">Math ML</a></li>
            <li><a href="files/time_behavior.pdf" target="_blank">Time Behavior</a></li>
            <li><a href="files/Ahmad Droobi public 2024.pdf" target="_blank">Ahmad Droobi Public 2024</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="flip-container">
      <div class="flipper flaming-effect">
        <div class="front">
          <h2>Other Directories</h2>
        </div>
        <div class="back">
          <ul>
            <li><a href="editor.html" target="_blank">Editor</a></li>
            <li><a href="math_review.html" target="_blank">Math Review</a></li>
            <li><a href="philosophy.html" target="_blank">Philosophy</a></li>
            <li><a href="repository_table.html" target="_blank">Repository Table</a></li>
            <li><a href="reporting_system.html">Reporting System</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
