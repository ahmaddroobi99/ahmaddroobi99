<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8" />
  <title>LaTeX Workbench · Modern Calculator UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />

  <!-- Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Material+Symbols+Rounded:FILL@0..1,GRAD@-50..200,opsz@20..48,wght@300..700&display=swap" rel="stylesheet" />

  <!-- MathJax v3 (TeX -> CHTML) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$","$"],["\\(","\\)"]],
        displayMath: [["\\[","\\]"]],
        packages: {"[+]": ["ams"]},
        tags: 'none'
      },
      options: { skipHtmlTags: {'[+]': ['textarea','pre','code']} },
      chtml: { scale: 1 }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Add syntax highlighting support -->
  <link rel="stylesheet" href="./css/prism-tomorrow.css">
  <script src="./js/prism.js"></script>

  <style>
    :root {
      /* Light */
      --bg: #0e1116;                /* gradient base used under glass */
      --page: #0b0f14;             /* canvas */
      --card: rgba(255,255,255,0.08);
      --ink: #e6edf3;
      --muted: #a6b3c2;
      --accent: #4f9cff;           /* primary */
      --accent-2: #22c55e;         /* success */
      --warn: #f59e0b;             /* warning */
      --danger: #ef4444;           /* danger */
      --key: #151a22;              /* key face */
      --key-top: #19202a;          /* key top highlight */
      --key-emboss: #0c0f14;       /* shadow */
      --shadow-2: 0 10px 25px rgba(0,0,0,.35);
      --shadow-1: 0 6px 14px rgba(0,0,0,.28);
      --radius: 14px;
      --ring: 0 0 0 2px rgba(79,156,255,.35);
      --grid-gap: 12px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #dfe8f5;
        --page: #eef3fa;
        --card: rgba(255,255,255,0.85);
        --ink: #0f172a;
        --muted: #5b687a;
        --key: #f6f8fc;
        --key-top: #ffffff;
        --key-emboss: #dfe6f3;
        --shadow-2: 0 22px 48px rgba(15,23,42,.12);
        --shadow-1: 0 10px 20px rgba(15,23,42,.10);
        --ring: 0 0 0 2px rgba(79,156,255,.25);
      }
    }

    /* App chrome */
    html, body { height: 100%; }
    body {
      margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at -10% -10%, #1f2937 0%, transparent 60%),
        radial-gradient(1000px 480px at 110% 10%, #0b2a5a55 0%, transparent 65%),
        linear-gradient(180deg, var(--bg), #0b0f14 70%);
      min-height: 100vh;
    }

    .app { max-width: 1150px; margin: 28px auto; padding: 0 16px; }

    .shell {
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-2);
      overflow: clip;
      border: 1px solid rgba(255,255,255,.12);
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.3px; }
    .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(79,156,255,.15); }
    .top-actions { display:flex; align-items:center; gap:10px; }

    /* Display (calculator screen) */
    .display {
      padding: 18px; display:grid; gap:10px;
      grid-template-columns: 1.1fr .9fr; align-items: stretch;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    }
    @media (max-width: 980px){ .display{ grid-template-columns: 1fr; } }

    .lcd {
      position: relative;
      background: var(--card);
      border-radius: 16px; padding: 16px 16px 12px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow-1) inset, 0 1px 0 rgba(255,255,255,.06);
    }
    .lcd .label { font-size: 12px; color: var(--muted); letter-spacing:.2px; }
    .lcd-inner { min-height: 120px; display:flex; align-items:flex-start; justify-content: flex-start; overflow:auto; }
    #preview { width: 100%; }

    /* Work grid */
    .work {
      display: grid; grid-template-columns: 1.1fr .9fr; gap: var(--grid-gap);
      padding: 16px; background: transparent;
    }
    @media (max-width: 1100px){ .work { grid-template-columns: 1fr; } }

    .panel { background: var(--card); border-radius: var(--radius); border: 1px solid rgba(255,255,255,.12); box-shadow: var(--shadow-1) inset; overflow: clip; }
    .panel-hd { display:flex; align-items:center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.12); background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)); }
    .panel-hd .hint { color: var(--muted); font-size: 12px; }

    /* Editor */
    #editor { width: 100%; height: 380px; border: 0; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.45; outline: none; background: transparent; color: var(--ink); resize: vertical; }

    /* Calculator keys */
    .keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 10px; padding: 12px; }
    .key, .btn { -webkit-tap-highlight-color: transparent; position: relative; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding: 12px 14px; border: 0; cursor: pointer; user-select: none; outline: none; text-decoration:none; font-weight: 600; color: var(--ink); border-radius: 12px; background: radial-gradient(120% 140% at 50% 10%, var(--key-top), var(--key)); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 .5px 0 rgba(255,255,255,.15), 0 6px 18px rgba(0,0,0,.22); overflow:hidden; }
    .key:active, .btn:active { transform: translateY(1px) scale(.995); }
    .key.k-accent, .btn.primary { background: radial-gradient(120% 140% at 50% 10%, #6bb2ff, #3a7be6); color: #0b1220; box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 8px 24px rgba(74,144,255,.5); }
    .btn.ghost { background: radial-gradient(120% 140% at 50% 10%, var(--key), var(--key-emboss)); color: var(--ink); border:1px solid rgba(255,255,255,.08); }
    .btn.small { padding: 8px 10px; font-size: 13px; border-radius: 10px; }
    .key.wide { grid-column: span 2; }
    .key.tall { grid-row: span 2; }

    .toolbar { display:flex; gap:10px; flex-wrap: wrap; }

    /* Ripple */
    .ripple { position:absolute; border-radius:50%; transform: scale(0); animation: ripple 600ms linear; background: currentColor; opacity:.2; pointer-events:none; }
    @keyframes ripple { to { transform: scale(3); opacity: 0; } }

    /* Symbol palettes styled as keypad decks */
    .palettes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 0 16px 16px; }
    .palette { background: var(--card); border: 1px solid rgba(255,255,255,.12); border-radius: var(--radius); box-shadow: var(--shadow-1) inset; overflow: clip; }
    .palette h5 { margin: 10px 12px; color: var(--muted); letter-spacing:.2px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(8, minmax(34px, 1fr)); gap: 8px; padding: 10px; }
    .sym { composes: key; }
    .sym, .grid .key { height: 42px; }

    /* Status bar */
    .status { display:flex; align-items:center; justify-content: space-between; gap: 10px; padding: 10px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid rgba(255,255,255,.12); background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); }

    /* Drop zone highlight */
    #dropZone.dragover { outline: 2px dashed #7fb4ff; outline-offset: -6px; background: linear-gradient(180deg, rgba(79,156,255,.08), transparent); }

    /* Focus ring */
    .key:focus-visible, .btn:focus-visible, #editor:focus-visible { box-shadow: var(--ring); }

    /* Add improved dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e0e0e0;
      }
      .editor {
        background-color: #1e1e1e;
        color: #ffffff;
      }
    }

    /* Add better accessibility features */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* Add new animations for visual feedback */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell" id="dropZone" aria-label="Drag & drop .tex here">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="dot"></span>
          <div>
            <div style="font-size:14px; opacity:.9;">LaTeX Workbench</div>
            <div style="font-size:11px; color:var(--muted); margin-top:-2px;">Calculator‑style UI</div>
          </div>
        </div>
        <div class="top-actions">
          <button id="btnTheme" class="btn small" title="Toggle theme">
            <span class="material-symbols-rounded">dark_mode</span>
            Theme
          </button>
          <button id="btnAuto" class="btn small" title="Auto compile (Ctrl+Shift+A)">
            <span class="material-symbols-rounded">autorenew</span>
            Auto
          </button>
          <a id="btnHelp" class="btn small ghost" href="#" title="Shortcuts & tips">
            <span class="material-symbols-rounded">help</span>
            Help
          </a>
        </div>
      </header>

      <!-- Display like a calculator screen: left = rendered, right = quick controls -->
      <section class="display">
        <div class="lcd">
          <div class="label">Preview</div>
          <div class="lcd-inner"><div id="preview"></div></div>
        </div>
        <div class="lcd">
          <div class="label">Quick Keys</div>
          <div class="keys" id="quickKeys"></div>
        </div>
      </section>

      <!-- Work area: Editor + Controls -->
      <section class="work">
        <div class="panel">
          <div class="panel-hd">
            <strong>Editor</strong>
            <div class="toolbar">
              <button id="btnInline" class="btn small" title="Wrap selection with $…$ (Ctrl+I)"><span class="material-symbols-rounded">subscript</span>Inline</button>
              <button id="btnDisplay" class="btn small" title="Wrap selection with \\[ … \\] (Ctrl+D)"><span class="material-symbols-rounded">functions</span>Display</button>
              <button id="btnCompile" class="btn primary" title="Compile (Ctrl+Enter)"><span class="material-symbols-rounded">check</span>Compile</button>
              <button id="btnClear" class="btn small ghost" title="Clear buffer"><span class="material-symbols-rounded">backspace</span>Clear</button>
            </div>
          </div>
          <textarea id="editor" spellcheck="false" placeholder="% Type LaTeX. Use palette or quick keys. Ctrl+Enter = Compile.">% !TEX program = pdflatex
\documentclass[tikz,border=2mm]{standalone}
\usepackage{amsmath,amssymb}
\usepackage{mathrsfs}
\usepackage{tikz}
\usetikzlibrary{arrows.meta,calc,positioning,fit,backgrounds,decorations.pathreplacing,shapes.geometric}
% ---------- Layers
\pgfdeclarelayer{bg}
\pgfsetlayers{bg,main}
% ---------- Palette
\definecolor{foundationBlue}{RGB}{36, 99, 235}
\definecolor{observerViolet}{RGB}{138, 75, 190}
\definecolor{physicsTeal}{RGB}{ 0, 148, 143}
\definecolor{couplingOrange}{RGB}{224, 120, 0}
\definecolor{roadmapGray}{RGB}{ 70, 78, 84}
\definecolor{paperTint}{RGB}{247,249,252}
\colorlet{bgFoundation}{foundationBlue!6}
\colorlet{bgObserver}{observerViolet!8}
\colorlet{bgPhysics}{physicsTeal!7}
\colorlet{bgCoupling}{couplingOrange!8}
\colorlet{bgRoadmap}{roadmapGray!8}
% ---------- Global toggles
\newif\ifShowJacobian \ShowJacobiantrue
\newif\ifShowHilbert \ShowHilberttrue
\newif\ifShowAxis \ShowAxistrue
\newif\ifEnableA \EnableAtrue
\newif\ifEnableB \EnableBtrue
\newif\ifEnableC \EnableCtrue
\newif\ifEnableD \EnableDtrue
% panel grid
\def\PanelW{12.8}
\def\PanelH{10.2}
\def\PanelGap{1.0}
% time axis
\def\axisLen{2*\PanelW + \PanelGap}
\def\timeY{-2.4}
\def\nTicks{16}
\def\dt{1.2}
\def\ta{9.0}
\def\tb{12.0}
% ---------- Styles
\tikzset{font=\small,
  card/.style={rectangle,rounded corners=4pt,very thick,minimum width=42mm,minimum height=12mm,text width=40mm,align=center,inner sep=3.5pt},
  cardF/.style={card,draw=foundationBlue!70!black,fill=bgFoundation},
  cardO/.style={card,draw=observerViolet!75!black,fill=bgObserver},
  cardP/.style={card,draw=physicsTeal!70!black,fill=bgPhysics},
  cardC/.style={card,draw=couplingOrange!80!black,fill=bgCoupling,text width=36mm,minimum width=0pt},
  cardM/.style={card,draw=roadmapGray!85!black,fill=bgRoadmap},
  dot/.style={circle,draw=foundationBlue!70!black,fill=bgFoundation,very thick,minimum size=8mm},
  flowF/.style={-{Latex[length=3mm]},very thick,draw=foundationBlue!85!black,shorten >=2pt,shorten <=2pt},
  flowO/.style={-{Latex[length=3mm]},very thick,draw=observerViolet!85!black,shorten >=2pt,shorten <=2pt},
  flowP/.style={-{Latex[length=3mm]},very thick,draw=physicsTeal!80!black,shorten >=2pt,shorten <=2pt},
  flowC/.style={-{Latex[length=2.8mm]},thick,draw=couplingOrange!95!black,shorten >=2pt,shorten <=2pt},
  flowM/.style={-{Latex[length=2.8mm]},thick,draw=roadmapGray!95!black,shorten >=2pt,shorten <=2pt},
  flowAxis/.style={-{Latex[length=3mm]},very thick,draw=black},
  auxflow/.style={-{Latex[length=2.6mm]},thick,draw=roadmapGray!80!black,dashed,shorten >=2pt,shorten <=2pt},
  note/.style={font=\scriptsize,inner sep=1pt},
  axisBadge/.style={draw=black,rounded corners=2pt,inner sep=1pt,fill=paperTint}
}
% ---------- Badges
\newcommand{\EdgeBadges}[3]{%
  \ifShowJacobian
    \node[axisBadge,anchor=north west] at (#1) {$J_{x}=\frac{\partial x}{\partial s}$};
    \path (#1) ++(#2,0) node[axisBadge,anchor=north east] {$J_{t}=\frac{\partial t}{\partial s}$};
    \path (#1) ++(0,#3) node[axisBadge,anchor=south west] {$J_{y}=\frac{\partial y}{\partial s}$};
    \path (#1) ++(#2,#3) node[axisBadge,anchor=south east] {$\det J$};
  \fi
}
% ---------- Windows (A-D) — omitted here for brevity in UI; keep your original definitions ...
% (Paste your full WindowA/B/C/D definitions)
\begin{document}
\begin{tikzpicture}[remember picture,overlay]
\begin{pgfonlayer}{bg}
  \fill[paperTint] (current bounding box.south west) rectangle (current bounding box.north east);
\end{pgfonlayer}
% ... your layout code ...
\end{tikzpicture}
\end{document}

        </div>

        <div class="panel">
          <div class="panel-hd">
            <strong>File & Run</strong>
            <div class="toolbar">
              <input id="fileInput" type="file" accept=".tex,.txt" hidden>
              <button id="btnOpen" class="btn small" title="Open .tex (Ctrl+O)"><span class="material-symbols-rounded">upload_file</span>Open</button>
              <button id="btnDownload" class="btn small" title="Download .tex (Ctrl+S)"><span class="material-symbols-rounded">download</span>Download</button>
              <button id="btnCopy" class="btn small ghost" title="Copy buffer (Ctrl+Shift+C)"><span class="material-symbols-rounded">content_copy</span>Copy</button>
            </div>
          </div>
          <div class="palettes">
            <div class="palette" data-group="greek"><h5>Greek</h5><div class="grid" id="pal-greek"></div></div>
            <div class="palette" data-group="operators"><h5>Operators</h5><div class="grid" id="pal-ops"></div></div>
            <div class="palette" data-group="arrows"><h5>Arrows</h5><div class="grid" id="pal-arrows"></div></div>
            <div class="palette" data-group="sets"><h5>Sets / Logic</h5><div class="grid" id="pal-sets"></div></div>
            <div class="palette" data-group="decor"><h5>Accents / Decorators</h5><div class="grid" id="pal-decor"></div></div>
            <div class="palette" data-group="fonts"><h5>Fonts</h5><div class="grid" id="pal-fonts"></div></div>
          </div>
        </div>
      </section>

      <footer class="status">
        <div id="statusLeft">Ready.</div>
        <div id="statusRight">Chars: <span id="charCount">0</span> · Render: <span id="renderMs">0</span> ms</div>
      </footer>
    </div>
  </div>

  <script>
    // ===================== Data =====================
    const LATEX_SYMBOL_PALETTES = {
      greek: [
        {g:'α', m:'\\alpha'}, {g:'β', m:'\\beta'}, {g:'γ', m:'\\gamma'}, {g:'δ', m:'\\delta'},
        {g:'ε', m:'\\epsilon'}, {g:'θ', m:'\\theta'}, {g:'λ', m:'\\lambda'}, {g:'μ', m:'\\mu'},
        {g:'π', m:'\\pi'}, {g:'ρ', m:'\\rho'}, {g:'σ', m:'\\sigma'}, {g:'τ', m:'\\tau'},
        {g:'φ', m:'\\phi'}, {g:'ψ', m:'\\psi'}, {g:'ω', m:'\\omega'},
        {g:'Γ', m:'\\Gamma'}, {g:'Δ', m:'\\Delta'}, {g:'Θ', m:'\\Theta'}, {g:'Λ', m:'\\Lambda'},
        {g:'Π', m:'\\Pi'}, {g:'Σ', m:'\\Sigma'}, {g:'Φ', m:'\\Phi'}, {g:'Ψ', m:'\\Psi'}, {g:'Ω', m:'\\Omega'}
      ],
      operators: [
        {g:'∑', m:'\\sum'}, {g:'∏', m:'\\prod'}, {g:'∫', m:'\\int'}, {g:'∬', m:'\\iint'},
        {g:'∮', m:'\\oint'}, {g:'∇', m:'\\nabla'}, {g:'∞', m:'\\infty'}, {g:'≈', m:'\\approx'},
        {g:'≃', m:'\\simeq'}, {g:'≅', m:'\\cong'}, {g:'≠', m:'\\neq'}, {g:'≤', m:'\\leq'},
        {g:'≥', m:'\\geq'}, {g:'±', m:'\\pm'}, {g:'∓', m:'\\mp'}, {g:'⋅', m:'\\cdot'},
        {g:'∘', m:'\\circ'}, {g:'∙', m:'\\bullet'}, {g:'√', m:'\\sqrt{}'}, {g:'^', m:'^{ }'},
        {g:'_', m:'_{ }'}, {g:'⌊⌋', m:'\\lfloor  \\rfloor'}, {g:'⌈⌉', m:'\\lceil  \\rceil'}
      ],
      arrows: [
        {g:'→', m:'\\to'}, {g:'⇒', m:'\\Rightarrow'}, {g:'↦', m:'\\mapsto'}, {g:'←', m:'\\leftarrow'},
        {g:'⇐', m:'\\Leftarrow'}, {g:'↔', m:'\\leftrightarrow'}, {g:'⇔', m:'\\Leftrightarrow'},
        {g:'↗', m:'\\nearrow'}, {g:'↘', m:'\\searrow'}, {g:'↩', m:'\\hookleftarrow'}, {g:'↪', m:'\\hookrightarrow'}
      ],
      sets: [
        {g:'∈', m:'\\in'}, {g:'∉', m:'\\notin'}, {g:'⊂', m:'\\subset'}, {g:'⊆', m:'\\subseteq'},
        {g:'⊃', m:'\\supset'}, {g:'⊇', m:'\\supseteq'}, {g:'∪', m:'\\cup'}, {g:'∩', m:'\\cap'},
        {g:'∖', m:'\\setminus'}, {g:'ℕ', m:'\\mathbb{N}'}, {g:'ℤ', m:'\\mathbb{Z}'},
        {g:'ℚ', m:'\\mathbb{Q}'}, {g:'ℝ', m:'\\mathbb{R}'}, {g:'ℂ', m:'\\mathbb{C}'},
        {g:'∀', m:'\\forall'}, {g:'∃', m:'\\exists'}, {g:'¬', m:'\\neg'}
      ],
      decor: [
        {g:'⃗', m:'\\vec{}'}, {g:'ˆ', m:'\\hat{}'}, {g:'˙', m:'\\dot{}'}, {g:'¨', m:'\\ddot{}'},
        {g:'¯', m:'\\overline{}'}, {g:'~', m:'\\tilde{}'}, {g:'⟨⟩', m:'\\langle  \\rangle'},
        {g:'‖ ‖', m:'\\lVert  \\rVert'}, {g:'| |', m:'\\lvert  \\rvert'}, {g:'〈〉', m:'\\left\\langle  \\right\\rangle'}
      ],
      fonts: [
        {g:'𝑨', m:'\\mathit{}'}, {g:'𝐀', m:'\\mathbf{}'}, {g:'𝒜', m:'\\mathcal{}'},
        {g:'𝔄', m:'\\mathfrak{}'}, {g:'𝕬', m:'\\mathbb{}'}, {g:'R', m:'\\mathrm{}'}
      ]
    };

    const QUICK_KEYS = [
      {g:'(', m:'('}, {g:')', m:')'}, {g:'[', m:'['}, {g:']', m:']'}, {g:'{ }', m:'{}'},
      {g:'^', m:'^{ }'}, {g:'_', m:'_{ }'}, {g:'\\frac{ }{ }', m:'\\frac{ }{ }', wide:true},
      {g:'\\sqrt{ }', m:'\\sqrt{ }', wide:true}, {g:'\\sum', m:'\\sum'}, {g:'\\int', m:'\\int'},
      {g:'\\to', m:'\\to'}, {g:'\\Rightarrow', m:'\\Rightarrow'}, {g:'\\mapsto', m:'\\mapsto'},
      {g:'\\begin{align}', m:'\\begin{align}\n\n\\end{align}', tall:true, wide:true},
      {g:'\\begin{bmatrix}', m:'\\begin{bmatrix}\n\\end{bmatrix}', wide:true},
      {g:'\\begin{cases}', m:'\\begin{cases}\n\\end{cases}', wide:true},
      {g:'\\mathbb{}', m:'\\mathbb{}'}, {g:'\\mathbf{}', m:'\\mathbf{}'},
    ];

    // ===================== Elements =====================
    const $ = (q, c=document) => c.querySelector(q);
    const editor = $('#editor');
    const preview = $('#preview');
    const dropZone = $('#dropZone');
    const charCountEl = $('#charCount');
    const renderMsEl = $('#renderMs');
    const statusLeft = $('#statusLeft');
    const STORAGE_KEY = 'latex-wb-buffer';
    const THEME_KEY = 'latex-wb-theme';
    const AUTO_KEY = 'latex-wb-auto';

    // ===================== State =====================
    let autoCompile = JSON.parse(localStorage.getItem(AUTO_KEY) ?? 'true');
    function setAutoUI(){ const b = $('#btnAuto'); b.classList.toggle('primary', autoCompile); b.title = `Auto compile ${autoCompile? 'ON':'OFF'} (Ctrl+Shift+A)`; }

    // ===================== Helpers =====================
    function addRipple(ev, el){
      const r = document.createElement('span');
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.className='ripple'; r.style.width = r.style.height = size+'px';
      r.style.left = (ev.clientX - rect.left - size/2) + 'px';
      r.style.top = (ev.clientY - rect.top - size/2) + 'px';
      el.appendChild(r); setTimeout(()=>r.remove(), 600);
    }

    function insertAtCursor(text) {
      const start = editor.selectionStart, end = editor.selectionEnd;
      const before = editor.value.slice(0, start);
      const after = editor.value.slice(end);
      editor.value = before + text + after;
      editor.focus();
      const caret = start + text.length;
      editor.setSelectionRange(caret, caret);
      localStorage.setItem(STORAGE_KEY, editor.value);
      updateCounts();
    }
    function wrapSelection(left, right) {
      const start = editor.selectionStart, end = editor.selectionEnd;
      const sel = editor.value.slice(start, end);
      const rep = left + (sel || ' ') + right;
      const before = editor.value.slice(0, start), after = editor.value.slice(end);
      editor.value = before + rep + after;
      editor.focus();
      editor.setSelectionRange(start + left.length, start + left.length + (sel || ' ').length);
      localStorage.setItem(STORAGE_KEY, editor.value);
      updateCounts();
    }

    async function compile(){
      const t0 = performance.now();
      preview.innerText = editor.value;
      await MathJax.typesetPromise([preview]);
      const t1 = performance.now();
      renderMsEl.textContent = Math.max(0, (t1 - t0) | 0);
      statusLeft.textContent = 'Compiled';
    }

    function updateCounts(){ charCountEl.textContent = editor.value.length.toLocaleString(); }

    function button(el, onClick){
      el.addEventListener('click', (ev)=>{ addRipple(ev, el); onClick?.(ev); });
    }

    function makeKey(host, label, macro, opts={}){
      const b = document.createElement('button');
      b.type='button'; b.className = 'key'; if (opts.wide) b.classList.add('wide'); if (opts.tall) b.classList.add('tall');
      b.innerHTML = `<span>${label}</span>`; b.title = macro; b.addEventListener('click', (ev)=>{
        addRipple(ev, b);
        const needsArg = /\{\s*\}/.test(macro);
        insertAtCursor(needsArg ? macro.replace(/\{\s*\}/, '{ }') : macro);
        if (autoCompile) debouncedCompile();
      });
      host.appendChild(b);
    }

    function hydrate(){
      // Persist buffer
      if (localStorage.getItem(STORAGE_KEY)) editor.value = localStorage.getItem(STORAGE_KEY);
      updateCounts();

      // Quick keys
      const qk = document.getElementById('quickKeys');
      QUICK_KEYS.forEach(k => makeKey(qk, k.g, k.m, k));

      // Palettes
      const groups = [ ['pal-greek','greek'], ['pal-ops','operators'], ['pal-arrows','arrows'], ['pal-sets','sets'], ['pal-decor','decor'], ['pal-fonts','fonts'] ];
      groups.forEach(([id, key]) => {
        const host = document.getElementById(id);
        LATEX_SYMBOL_PALETTES[key].forEach(x => makeKey(host, x.g, x.m));
      });

      setAutoUI();

      // Theme
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    }

    // Debounce for auto-compile
    let timer;
    function debouncedCompile(){ clearTimeout(timer); timer = setTimeout(compile, 180); }

    // ===================== Wiring =====================
    hydrate();

    // Editor typing
    editor.addEventListener('input', ()=>{ localStorage.setItem(STORAGE_KEY, editor.value); updateCounts(); if (autoCompile) debouncedCompile(); });

    // File open/download/copy
    button(document.getElementById('btnOpen'), ()=> document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', async (e)=>{
      const f = e.target.files[0]; if (!f) return;
      const text = await f.text(); editor.value = text; localStorage.setItem(STORAGE_KEY, text); updateCounts(); if (autoCompile) debouncedCompile(); e.target.value='';
    });
    button(document.getElementById('btnDownload'), ()=>{
      const blob = new Blob([editor.value], { type: 'text/x-tex' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'diagram.tex'; a.click(); URL.revokeObjectURL(a.href);
    });
    button(document.getElementById('btnCopy'), async ()=>{
      try { await navigator.clipboard.writeText(editor.value); statusLeft.textContent = 'Copied to clipboard'; } catch { statusLeft.textContent = 'Clipboard blocked'; }
    });

    // Edit controls
    button(document.getElementById('btnInline'), ()=> wrapSelection('$','$'));
    button(document.getElementById('btnDisplay'), ()=> wrapSelection('\\[','\\]'));
    button(document.getElementById('btnCompile'), compile);
    button(document.getElementById('btnClear'), ()=>{ editor.value=''; localStorage.removeItem(STORAGE_KEY); preview.innerHTML=''; updateCounts(); statusLeft.textContent='Cleared'; });

    // Theme + Auto
    button(document.getElementById('btnTheme'), ()=>{
      const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = cur; localStorage.setItem(THEME_KEY, cur);
    });
    button(document.getElementById('btnAuto'), ()=>{ autoCompile = !autoCompile; localStorage.setItem(AUTO_KEY, JSON.stringify(autoCompile)); setAutoUI(); if (autoCompile) debouncedCompile(); });

    // Help
    button(document.getElementById('btnHelp'), (e)=>{
      e.preventDefault();
      alert('Shortcuts:\n\nCtrl+Enter: Compile\nCtrl+S: Download .tex\nCtrl+O: Open .tex\nCtrl+I: Wrap inline $…$\nCtrl+D: Wrap display \\[ … \\]\nCtrl+Shift+A: Toggle Auto compile');
    });

    // Drag & drop
    ['dragenter','dragover'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', async e => {
      const f = e.dataTransfer.files?.[0];
      if (f && (f.name.endsWith('.tex') || f.type.startsWith('text/'))) {
        const text = await f.text(); editor.value = text; localStorage.setItem(STORAGE_KEY, text); updateCounts(); if (autoCompile) debouncedCompile();
      } else {
        const text = e.dataTransfer.getData('text/plain');
        if (text) { insertAtCursor(text); if (autoCompile) debouncedCompile(); }
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e)=>{
      if (e.ctrlKey && e.key === 'Enter'){ e.preventDefault(); compile(); }
      if (e.ctrlKey && (e.key === 's' || e.key === 'S')){ e.preventDefault(); document.getElementById('btnDownload').click(); }
      if (e.ctrlKey && (e.key === 'o' || e.key === 'O')){ e.preventDefault(); document.getElementById('btnOpen').click(); }
      if (e.ctrlKey && (e.key === 'i' || e.key === 'I')){ e.preventDefault(); wrapSelection('$','$'); }
      if (e.ctrlKey && (e.key === 'd' || e.key === 'D')){ e.preventDefault(); wrapSelection('\\[','\\]'); }
      if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A')){ e.preventDefault(); document.getElementById('btnAuto').click(); }
      if (e.ctrlKey && e.shiftKey && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        editor.value = formatLatex(editor.value);
      }
      if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undo();
      }
      if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) {
        e.preventDefault();
        redo();
      }
    });

    // Initial compile
    compile();
  </script>
</body>

    :root {
