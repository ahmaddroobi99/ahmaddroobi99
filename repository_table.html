<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Table</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f6f8ff;
      color: #0e1726;
    }
    h1 {
      color: #003366;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #e6eef5;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #003366;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Repository Table</h1>
  <table>
    <thead>
      <tr>
        <th>Category</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Reports</td>
        <td>Scientific reports and findings.</td>
      </tr>
      <tr>
        <td>Papers</td>
        <td>Published papers and articles.</td>
      </tr>
      <tr>
        <td>Games</td>
        <td>Interactive games and simulations.</td>
      </tr>
      <tr>
        <td>Ideas</td>
        <td>Innovative concepts and proposals.</td>
      </tr>
      <tr>
        <td>Technical Skills</td>
        <td>Showcase of technical expertise.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
